<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <title>Анкета получена</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style-short.css">
</head>

<body>

<div class="card">

  <header>
    <h1>Анкета получена</h1>
    <p>Вот что ты указал</p>
  </header>

  <main>

    <dl class="data">
      <div>
        <dt>Имя</dt>
        <dd id="name">@name@</dd>
      </div>

      <div class="row">
        <div>
          <dt>Возраст</dt>
          <dd id="age">@age@</dd>
        </div>
        <div>
          <dt>Город</dt>
          <dd id="city">@city@</dd>
        </div>
      </div>

      <div>
        <dt>Пол</dt>
        <dd id="gender">@gender@</dd>
      </div>

      <div class="row">
        <div>
          <dt>Рост, см</dt>
          <dd id="height">@height@</dd>
        </div>
        <div>
          <dt>Вес, кг</dt>
          <dd id="weight">@weight@</dd>
        </div>
      </div>

      <div>
        <dt>О себе</dt>
        <dd id="about" class="about">@about@</dd>
      </div>
    </dl>

    <a class="back" href="/anketa">Заполнить заново</a>

  </main>

</div>

</body>

</html>
